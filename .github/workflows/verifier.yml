name: Vérifier le site

# Mêmes contrôles que le déploiement, sur chaque pull request :
# une erreur est vue avant la fusion sur main, pas après la mise en ligne.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run verifier

      # Correspondance activités → objectifs du programme cohérente
      # (objectifs connus, niveaux concordants). Sortie non publiée.
      - run: npm run couverture > /dev/null
