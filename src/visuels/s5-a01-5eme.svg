  <title id="v-s5a015eme-t">La situation : une maison à imaginer en Nouvelle-Calédonie</title>
  <desc id="v-s5a015eme-d">Le contour d'une maison, vide à l'intérieur. Au-dessus, un soleil et un nuage de pluie. À côté, une famille et une bulle marquée d'un point d'interrogation. Trois repères numérotés posent les questions de l'activité.</desc>
