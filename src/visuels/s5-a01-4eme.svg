  <title id="v-s5a014eme-t">La situation : un téléphone qui a besoin d'un support</title>
  <desc id="v-s5a014eme-d">Un téléphone posé à plat sur une table, à côté d'un cahier ouvert. Au-dessus, un emplacement en pointillés marqué d'un point d'interrogation : le support reste à imaginer. Trois repères numérotés posent les questions de l'activité.</desc>
