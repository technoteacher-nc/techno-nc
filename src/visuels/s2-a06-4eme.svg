  <title id="v-s2a064eme-t">La situation : deux versions d'une même application</title>
  <desc id="v-s2a064eme-d">Deux écrans de téléphone affichent la même application. À gauche, beaucoup de petits boutons serrés ; à droite, trois grands boutons. Trois repères numérotés posent les questions de l'activité.</desc>
