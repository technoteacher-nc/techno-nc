  <title id="v-s6a034-t">La situation : deux capteurs, deux comportements</title>
  <desc id="v-s6a034-d">Deux scènes vues de dessus. À gauche, le robot approche d'un obstacle et des ondes partent vers lui. À droite, le robot roule au-dessus d'une ligne noire tracée au sol. Trois repères numérotés posent les questions de l'activité.</desc>
