<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s6a064eme-t v-s6a064eme-d" class="visuel-svg">
  <title id="v-s6a064eme-t">La situation : des mesures rangées dans un tableur</title>
  <desc id="v-s6a064eme-d">Une feuille de tableur avec des colonnes repérées par des lettres et des lignes repérées par des numéros. Les cellules sont remplies, sans valeurs lisibles. Une ligne est encadrée en bleu, une colonne en pointillés jaunes. À droite, deux boutons : trier et filtrer. Trois repères numérotés posent les questions de l'activité.</desc>
