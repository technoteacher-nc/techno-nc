<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s4a014eme-t v-s4a014eme-d" class="visuel-svg">
  <title id="v-s4a014eme-t">La situation : un message à vérifier</title>
  <desc id="v-s4a014eme-d">Un message électronique ouvert : un expéditeur, un objet, quelques lignes et un bouton à cliquer. Rien n'est entouré. À côté, un cadenas. Trois repères numérotés posent les questions de l'activité.</desc>
  <rect x="60" y="24" width="400" height="252" rx="8" fill="#FCFCFA" stroke="#11223D" stroke-width="2.5"/>
    <text x="80" y="60" font-family="Space Grotesk, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#5B6B80">De :</text><rect x="126" y="44" width="200" height="22" rx="4" fill="#EDF1F6"/>
    <text x="80" y="96" font-family="Space Grotesk, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#5B6B80">Objet :</text><rect x="148" y="80" width="250" height="22" rx="4" fill="#EDF1F6"/>
    <g stroke="#5B6B80" stroke-width="4" stroke-linecap="round"><line x1="84" y1="136" x2="430" y2="136"/><line x1="84" y1="160" x2="400" y2="160"/><line x1="84" y1="184" x2="420" y2="184"/></g>
    <rect x="170" y="210" width="180" height="40" rx="20" fill="#1C5FBF"/><text x="260" y="236" font-family="Space Grotesk, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#FCFCFA">Cliquez ici</text>
