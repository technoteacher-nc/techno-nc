  <title id="v-s4a024eme-t">La situation : des traces, puis une publicité</title>
  <desc id="v-s4a024eme-d">À gauche, un téléphone. Des empreintes de pas partent de lui et mènent à un écran où s'affiche une publicité marquée d'un point d'interrogation. Trois repères numérotés posent les questions de l'activité.</desc>
