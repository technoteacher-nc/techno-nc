  <title id="v-s5a055eme-t">La situation : la pièce numérique devient une maquette en papier</title>
  <desc id="v-s5a055eme-d">À gauche, la pièce sur l'écran. Une flèche marquée « 1/20 ? » mène à une maquette en papier, dont les murs se plient à partir d'un patron. Trois repères numérotés posent les questions de l'activité.</desc>
