<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s1a053eme-t v-s1a053eme-d" class="visuel-svg">
  <title id="v-s1a053eme-t">La situation : le numérique dans la vie et au travail</title>
  <desc id="v-s1a053eme-d">À gauche, un téléphone avec trois applications. Au centre, un point relié à huit autres : une information qui se propage. À droite, une personne à son poste de travail, devant un ordinateur. Trois repères numérotés posent les questions de l'activité.</desc>
