<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s6a01-titre v-s6a01-desc" class="visuel-svg">
  <title id="v-s6a01-titre">La situation : le mBot face à un obstacle</title>
  <desc id="v-s6a01-desc">Vue de dessus. Le mBot avance vers un mur. Devant lui, des ondes partent vers le mur. Une cote indique le seuil de 10 cm. Une flèche montre le robot qui recule puis fait demi-tour. Trois repères numérotés posent les questions de l'activité.</desc>
  <defs>
    <pattern id="v-s6a01-hachures" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#5B6B80" stroke-width="1.5"/>
    </pattern>
    <marker id="v-s6a01-fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1C5FBF"/>
    </marker>
    <marker id="v-s6a01-cote" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9" fill="none" stroke="#11223D" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- l'obstacle : un mur en coupe, hachuré comme sur un plan -->
  <rect x="600" y="30" width="44" height="200" fill="url(#v-s6a01-hachures)" stroke="#11223D" stroke-width="2"/>
  <text x="622" y="262" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="22" font-weight="600" fill="#11223D">obstacle</text>

  <!-- trajet : il arrivait tout droit… -->
  <line x1="30" y1="130" x2="196" y2="130" stroke="#1C5FBF" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#v-s6a01-fleche)"/>
  <!-- …puis recule et fait demi-tour -->
  <path d="M250 64 C 200 20, 120 20, 96 70" fill="none" stroke="#1C5FBF" stroke-width="2.5" marker-end="url(#v-s6a01-fleche)"/>

  <!-- le mBot, vue de dessus -->
  <g stroke="#11223D" stroke-width="2.5" fill="#FCFCFA">
    <rect x="222" y="70" width="190" height="120" rx="14"/>
    <rect x="246" y="46" width="96" height="22" rx="5" fill="#EDF1F6"/>
    <rect x="246" y="192" width="96" height="22" rx="5" fill="#EDF1F6"/>
    <rect x="300" y="100" width="70" height="60" rx="4" fill="#EDF1F6"/>
    <circle cx="420" cy="110" r="13"/>
    <circle cx="420" cy="150" r="13"/>
  </g>

  <!-- ondes vers l'obstacle -->
  <g fill="none" stroke="#1C5FBF" stroke-width="2" stroke-linecap="round">
    <path d="M452 100 Q 464 130 452 160"/>
    <path d="M480 88 Q 498 130 480 172"/>
    <path d="M510 78 Q 532 130 510 182"/>
  </g>

  <!-- la cote : le seuil de 10 cm, comme sur un dessin technique -->
  <line x1="434" y1="200" x2="434" y2="246" stroke="#11223D" stroke-width="1.2"/>
  <line x1="436" y1="236" x2="598" y2="236" stroke="#11223D" stroke-width="1.5" marker-start="url(#v-s6a01-cote)" marker-end="url(#v-s6a01-cote)"/>
  <rect x="478" y="214" width="76" height="30" fill="#FCFCFA"/>
  <text x="516" y="238" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#11223D">10 cm</text>

  <!-- les trois questions de l'activité, en repères numérotés -->
  <g font-family="Space Grotesk, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <circle cx="482" cy="44" r="19" fill="#1C5FBF"/>
    <text x="482" y="52" fill="#FCFCFA">1</text>
    <circle cx="335" cy="130" r="19" fill="#1C5FBF"/>
    <text x="335" y="138" fill="#FCFCFA">2</text>
    <circle cx="200" cy="232" r="19" fill="#1C5FBF"/>
    <text x="200" y="240" fill="#FCFCFA">3</text>
  </g>
  <line x1="215" y1="221" x2="244" y2="204" stroke="#1C5FBF" stroke-width="1.5"/>
</svg>
