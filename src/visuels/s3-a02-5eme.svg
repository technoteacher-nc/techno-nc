<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s3a025eme-t v-s3a025eme-d" class="visuel-svg">
  <title id="v-s3a025eme-t">La situation : une photo qui part de Nouméa</title>
  <desc id="v-s3a025eme-d">À gauche, une île marquée Nouvelle-Calédonie et un téléphone qui envoie une photo. À droite, très loin, la France. Entre les deux, un trajet en pointillés jalonné de points d'interrogation. Trois repères numérotés posent les questions de l'activité.</desc>
