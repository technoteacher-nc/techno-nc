  <title id="v-s3a015eme-t">La situation : mon fichier, d'un poste à l'autre</title>
  <desc id="v-s3a015eme-d">À gauche, un ordinateur de la salle avec un fichier. À droite, un autre ordinateur, devant lequel un fichier est marqué d'un point d'interrogation. Au centre, un boîtier non nommé. Trois repères numérotés posent les questions de l'activité.</desc>
