  <title id="v-s1a06-t">La situation : un mot que chacun comprend à sa façon</title>
  <desc id="v-s1a06-d">Deux personnes. Au milieu, le mot « solide ». Dans la bulle de la première, une petite boîte ; dans la bulle de la seconde, une grande boîte renforcée. Chacun imagine autre chose. Trois repères numérotés posent les questions de l'activité.</desc>
