<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s6a035-t v-s6a035-d" class="visuel-svg">
  <title id="v-s6a035-t">La situation : une spirale qui grandit</title>
  <desc id="v-s6a035-d">Sur la scène, le lutin, représenté par une flèche, a tracé une spirale carrée : chaque côté est plus long que le précédent. Les longueurs des côtés sont marquées d'un point d'interrogation. À droite, une case mémoire vide. Trois repères numérotés posent les questions de l'activité.</desc>
  <rect x="30" y="20" width="420" height="260" rx="8" fill="#FCFCFA" stroke="#11223D" stroke-width="2.5"/>
  <path d="M240 150 h 20 v -30 h -50 v 70 h 90 v -110 h -130 v 150 h 170 v -190" fill="none" stroke="#1C5FBF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M330 40 l -9 16 l 18 0 z" fill="#11223D"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#5B6B80" text-anchor="middle">
    <text x="250" y="168">?</text><text x="196" y="160">?</text><text x="255" y="210">?</text><text x="186" y="252">?</text>
  </g>
  <rect x="490" y="96" width="160" height="96" rx="8" fill="#EDF1F6" stroke="#11223D" stroke-width="2"/>
  <text x="570" y="128" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="19" font-weight="700" fill="#11223D">longueur</text>
  <rect x="530" y="142" width="80" height="34" rx="4" fill="#FCFCFA" stroke="#C3CEDC" stroke-width="2"/>
  <text x="570" y="166" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#5B6B80">?</text>
  <g font-family="Space Grotesk, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="104" r="19" fill="#1C5FBF"/><text x="300" y="112" fill="#FCFCFA">1</text>
    <circle cx="650" cy="96" r="19" fill="#1C5FBF"/><text x="650" y="104" fill="#FCFCFA">2</text>
    <circle cx="450" cy="40" r="19" fill="#1C5FBF"/><text x="450" y="48" fill="#FCFCFA">3</text>
  </g>
</svg>
