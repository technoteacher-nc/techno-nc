<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s1a04-t v-s1a04-d" class="visuel-svg">
  <title id="v-s1a04-t">La situation : l'ordinateur et ce qui s'y branche</title>
  <desc id="v-s1a04-d">Au centre, un ordinateur. Autour, quatre appareils sans nom : un clavier, un écran, une imprimante et une clé. Chacun est relié à l'ordinateur par un trait sans flèche, marqué d'un point d'interrogation. Trois repères numérotés posent les questions de l'activité.</desc>
