<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s6a045-t v-s6a045-d" class="visuel-svg">
  <title id="v-s6a045-t">La situation : le labyrinthe du défi</title>
  <desc id="v-s6a045-d">Vue de dessus d'un labyrinthe sur la scène de Scratch. Le lutin, représenté par une flèche, est à l'entrée ; un drapeau marque la sortie. Aucun chemin n'est tracé. À droite, la liste des essais attend d'être remplie. Trois repères numérotés posent les questions de l'activité.</desc>
  <rect x="30" y="20" width="420" height="260" rx="8" fill="#FCFCFA" stroke="#11223D" stroke-width="2.5"/>
  <g stroke="#11223D" stroke-width="6" stroke-linecap="square" fill="none">
    <path d="M60 50 H 420 V 250 H 140"/><path d="M60 50 V 250 H 90"/>
    <path d="M120 50 V 190"/><path d="M180 110 V 250"/><path d="M180 110 H 300"/><path d="M240 170 H 360 V 110"/><path d="M300 50 V 80"/><path d="M360 190 V 250"/>
  </g>
  <path d="M115 238 l -16 -9 l 0 18 z" fill="#1C5FBF" transform="rotate(-90 107 238)"/>
  <line x1="390" y1="88" x2="390" y2="130" stroke="#11223D" stroke-width="2.5"/><path d="M390 88 l 22 8 l -22 8 z" fill="#1C5FBF"/>
  <rect x="490" y="50" width="160" height="200" rx="8" fill="#FCFCFA" stroke="#11223D" stroke-width="2"/>
  <text x="570" y="82" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="19" font-weight="700" fill="#11223D">essais</text>
