<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s1a023eme-t v-s1a023eme-d" class="visuel-svg">
  <title id="v-s1a023eme-t">La situation : d'une découverte de laboratoire à un objet, puis à la société</title>
  <desc id="v-s1a023eme-d">Trois cadres reliés par des flèches : une fiole de laboratoire (la découverte), un panneau solaire (l'objet), une maison et deux personnes (la société). Une question sous la frise demande combien de temps passe entre les deux. Trois repères numérotés posent les questions de l'activité.</desc>
