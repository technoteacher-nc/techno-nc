  <title id="v-s4a015eme-t">La situation : un mot de passe face au temps</title>
  <desc id="v-s4a015eme-d">Un champ de mot de passe rempli de points. À côté, un cadenas et un chronomètre qui affiche un point d'interrogation : combien de temps pour le casser ? Trois repères numérotés posent les questions de l'activité.</desc>
