<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s1a043eme-t v-s1a043eme-d" class="visuel-svg">
  <title id="v-s1a043eme-t">La situation : une caméra et une IA trient des pièces</title>
  <desc id="v-s1a043eme-d">Sur un tapis roulant, cinq pièces avancent ; l'une a une fissure. Une caméra, au-dessus, vise la pièce du milieu, encadrée. Une étiquette demande : bonne ou mauvaise ? Trois repères numérotés posent les questions de l'activité.</desc>
