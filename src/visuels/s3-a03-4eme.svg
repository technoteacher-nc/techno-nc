  <title id="v-s3a034eme-t">La situation : une adresse de site, deux réseaux</title>
  <desc id="v-s3a034eme-d">En haut, la barre d'adresse d'un navigateur avec un nom de site ; une flèche mène à une adresse faite de quatre points d'interrogation. En bas, deux réseaux reliés par un boîtier marqué d'un point d'interrogation. Trois repères numérotés posent les questions de l'activité.</desc>
