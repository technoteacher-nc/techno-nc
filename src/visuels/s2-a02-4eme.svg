<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s2a024eme-t v-s2a024eme-d" class="visuel-svg">
  <title id="v-s2a024eme-t">La situation : la maison qui s'allume toute seule</title>
  <desc id="v-s2a024eme-d">Coupe d'une maison, la nuit. Une personne passe la porte ; un petit boîtier est fixé au mur près de la porte, un autre boîtier dans la pièce, et la lampe du plafond s'allume. Rien n'est nommé. Trois repères numérotés posent les questions de l'activité.</desc>
