  <title id="v-s6a015-t">La situation : un robot aspirateur sur un sol quadrillé</title>
  <desc id="v-s6a015-d">Vue de dessus d'une pièce quadrillée. Le robot aspirateur est dans le coin en bas à gauche, tourné vers le haut. Des taches de poussière sont réparties sur le quadrillage. À droite, un carnet d'ordres vide attend les instructions. Trois repères numérotés posent les questions de l'activité.</desc>
