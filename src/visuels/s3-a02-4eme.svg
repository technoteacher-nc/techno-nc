  <title id="v-s3a024eme-t">La situation : deux machines qui doivent se parler</title>
  <desc id="v-s3a024eme-d">Deux ordinateurs reliés par un câble. Au-dessus du câble, une bulle avec un point d'interrogation : le message est-il arrivé ? Un troisième ordinateur attend, pas encore branché. Trois repères numérotés posent les questions de l'activité.</desc>
