<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s1a013eme-t v-s1a013eme-d" class="visuel-svg">
  <title id="v-s1a013eme-t">La situation : cinq téléphones à ranger dans le temps</title>
  <desc id="v-s1a013eme-d">Cinq cartes montrent cinq téléphones différents, dans le désordre : un vieux combiné, un mobile à antenne, un smartphone, un téléphone à touches, un mobile à petit écran. En dessous, une frise orientée du plus ancien au plus récent, avec cinq cases vides marquées d'un point d'interrogation. Trois repères numérotés posent les questions de l'activité.</desc>
