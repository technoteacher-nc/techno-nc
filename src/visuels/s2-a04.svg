<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s2a04-t v-s2a04-d" class="visuel-svg">
  <title id="v-s2a04-t">La situation : un objet jeté, sur une île</title>
  <desc id="v-s2a04-d">À gauche, une île marquée Nouvelle-Calédonie, avec une poubelle d'où dépasse un téléphone. À droite, de l'autre côté de la mer, une usine. Entre les deux, une flèche en pointillés et un point d'interrogation. Trois repères numérotés posent les questions de l'activité.</desc>
