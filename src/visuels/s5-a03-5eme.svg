  <title id="v-s5a035eme-t">La situation : du plan papier à la maquette numérique</title>
  <desc id="v-s5a035eme-d">À gauche, un plan papier vu de dessus. Une flèche mène à un écran où les murs de la maison s'élèvent en trois dimensions, encore sans portes ni fenêtres. Trois repères numérotés posent les questions de l'activité.</desc>
