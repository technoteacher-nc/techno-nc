<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="v-s6a024-t v-s6a024-d" class="visuel-svg">
  <title id="v-s6a024-t">La situation : le quart de tour prévu et le quart de tour réel</title>
  <desc id="v-s6a024-d">Vue de dessus. Le programme demande au robot de tourner d'un quart de tour, 90 degrés, tracé en pointillés. Le robot réel s'arrête avant : son angle est marqué d'un point d'interrogation. Trois repères numérotés posent les questions de l'activité.</desc>
  <line x1="160" y1="240" x2="560" y2="240" stroke="#C3CEDC" stroke-width="2"/>
  <line x1="200" y1="240" x2="200" y2="40" stroke="#11223D" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="200" y1="240" x2="520" y2="240" stroke="#11223D" stroke-width="2"/>
  <path d="M200 200 h 40 v 40" fill="none" stroke="#11223D" stroke-width="1.8"/>
  <text x="186" y="130" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#11223D">90° prévu</text>
  <line x1="200" y1="240" x2="330" y2="78" stroke="#1C5FBF" stroke-width="3"/>
  <path d="M290 240 A 90 90 0 0 0 256 170" fill="none" stroke="#1C5FBF" stroke-width="2"/>
  <text x="300" y="226" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1C5FBF">?°</text>
