  </g>
  <g font-family="Space Grotesk, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <circle cx="200" cy="40" r="19" fill="#1C5FBF"/><text x="200" y="48" fill="#FCFCFA">1</text>
    <circle cx="420" cy="60" r="19" fill="#1C5FBF"/><text x="420" y="68" fill="#FCFCFA">2</text>
    <circle cx="560" cy="240" r="19" fill="#1C5FBF"/><text x="560" y="248" fill="#FCFCFA">3</text>
