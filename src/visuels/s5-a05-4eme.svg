  <title id="v-s5a054eme-t">La situation : le prototype face au test</title>
  <desc id="v-s5a054eme-d">Un prototype en carton, dessiné en pointillés car sa forme dépend de ta solution, avec un téléphone posé dessus. Une flèche vers le bas indique une charge, et un rapporteur mesure un angle inconnu. Trois repères numérotés posent les questions de l'activité.</desc>
