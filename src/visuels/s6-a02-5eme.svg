  <title id="v-s6a025-t">La situation : de l'algorithme papier au programme à l'écran</title>
  <desc id="v-s6a025-d">À gauche, une feuille où l'algorithme est écrit en lignes. Une flèche mène à un écran. Sur l'écran, une zone de blocs vide et une scène où le lutin, représenté par une flèche, doit tracer un carré dessiné en pointillés. Trois repères numérotés posent les questions de l'activité.</desc>
